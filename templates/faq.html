{% extends "base.html" %}
{% block main %}{% import "macros.html" as m with context %}
{{ m.pagehead('faq', 'question', 'nointro') }}
<div class="wrap narrow">
  <div class="faq">
    {% for item in t('faq.items') %}
    <details class="faq__item"{% if loop.first %} open{% endif %}>
      <summary><h2>{{ item.q }}</h2></summary>
      <p>{{ item.a|replace('{v}', site.download.version) }}</p>
    </details>
    {% endfor %}
  </div>
</div>
{% endblock %}
