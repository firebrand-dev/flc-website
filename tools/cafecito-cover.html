<!doctype html>
<!-- Cover image ("mural") for the owner's Cafecito page, in the site's Adventurer's Codex world. Original art only:
     no game captures. Cafecito shows covers at 5:1 (stored 1000x200, cropped to the centre on phones), so the
     message sits in the middle 60%. Render: python tools/brand.py -->
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "IM Fell English SC"; src: url("../assets/fonts/im-fell-english-sc-latin-normal-400.woff2") format("woff2"); }
  @font-face { font-family: "Alegreya Sans"; font-weight: 400; src: url("../assets/fonts/alegreya-sans-latin-normal-400.woff2") format("woff2"); }
  @font-face { font-family: "Alegreya Sans"; font-weight: 700; src: url("../assets/fonts/alegreya-sans-latin-normal-700.woff2") format("woff2"); }
  html, body { margin: 0; width: 1000px; height: 200px; overflow: hidden; }
  body { position: relative; background: url("../assets/img/leather.webp") 0 0 / 256px 256px, #100d0b; }
  /* tooled border of the binding */
  .bind { position: absolute; inset: 8px; border: 1px solid rgba(201, 162, 77, .45); box-shadow: inset 0 0 0 4px rgba(9, 7, 6, .5), inset 0 0 0 5px rgba(201, 162, 77, .18); }
  /* the route: dashed ink across the cover with waypoints */
  .route { position: absolute; left: 0; right: 0; top: 0; width: 1000px; height: 200px; }
  /* the leaf in the middle */
  .leaf {
    position: absolute; left: 50%; top: 50%; width: 660px; height: 128px; transform: translate(-50%, -50%);
    background:
      radial-gradient(140% 90% at 0% 0%, rgba(255, 252, 240, .5), transparent 55%),
      radial-gradient(120% 120% at 100% 100%, rgba(150, 112, 52, .34), transparent 60%),
      #e9dcbc;
    box-shadow: 0 14px 30px -12px rgba(0, 0, 0, .9), inset 0 0 0 1px rgba(122, 98, 50, .55), inset 0 0 40px rgba(122, 88, 40, .3);
    display: grid; grid-template-columns: 64px 1fr; align-items: center; gap: 18px; padding: 0 30px; box-sizing: border-box;
  }
  .leaf::before { content: ""; position: absolute; inset: 7px; border: 1px solid rgba(42, 32, 22, .28); }
  .emblem { width: 64px; height: 64px; color: #7c2412; }
  h1 { margin: 0; font: 400 34px/1 "IM Fell English SC"; white-space: nowrap, Georgia, serif; color: #7c2412; letter-spacing: .01em; }
  p { margin: 8px 0 0; font: 400 16.5px/1.3 "Alegreya Sans"; white-space: nowrap, sans-serif; color: #2a2016; }
  p b { font-weight: 700; }
  .seal { position: absolute; right: -16px; bottom: -14px; width: 46px; height: 46px; background: url("../assets/img/seal-tested.svg") center / contain no-repeat; filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .6)); }
</style>
</head>
<body>
  <div class="bind"></div>
  <svg class="route" viewBox="0 0 1000 200" aria-hidden="true">
    <path d="M24 150 C 120 150, 140 60, 230 70 S 300 150, 340 130 M 660 70 C 720 50, 740 150, 810 140 S 900 60, 976 52"
          fill="none" stroke="rgba(201,162,77,.55)" stroke-width="2" stroke-dasharray="6 7"/>
    <g fill="#8f2a17" stroke="#e3c47c" stroke-width="1.5">
      <rect x="-6" y="-6" width="12" height="12" transform="translate(230 70) rotate(45)"/>
      <rect x="-6" y="-6" width="12" height="12" transform="translate(812 140) rotate(45)"/>
    </g>
    <g fill="none" stroke="#c9a24d" stroke-width="1.2" opacity=".7">
      <circle cx="96" cy="64" r="30"/><circle cx="96" cy="64" r="22" stroke-dasharray="1.5 4"/>
      <path d="M96 28v72M60 64h72"/><path d="M96 38 101 59 122 64 101 69 96 90 91 69 70 64 91 59Z" fill="rgba(201,162,77,.25)"/>
    </g>
    <text x="96" y="25" text-anchor="middle" font-family="IM Fell English SC, serif" font-size="13" fill="#c9a24d" opacity=".8">N</text>
    <g fill="none" stroke="#c9a24d" stroke-width="1.2" opacity=".55">
      <path d="M884 150 l10 -18 l10 18 Z M900 150 l9 -14 l9 14 Z M872 150 h56"/>
    </g>
  </svg>
  <div class="leaf">
    <svg class="emblem" viewBox="0 0 48 48" aria-hidden="true">
      <circle cx="24" cy="24" r="21.5" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".6"/>
      <circle cx="24" cy="24" r="18" fill="none" stroke="currentColor" stroke-width=".6" stroke-dasharray="1.2 2.6" opacity=".6"/>
      <path d="M24 1.5v5M24 41.5v5M1.5 24h5M41.5 24h5" stroke="currentColor" stroke-width="1.4"/>
      <path d="M24 9 39 24 24 39 9 24Z" fill="#100d0b" stroke="currentColor" stroke-width="1.5"/>
      <path d="M18.5 30.5 29 20m0 0h-7m7 0v7" fill="none" stroke="#efe4c8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="24" cy="24" r="1.6" fill="#8f2a17"/>
    </svg>
    <div>
      <h1>Forever Leveling Companion</h1>
      <p><b>Gratis para cada aventurero.</b> Tu cafecito mantiene vivas las guías.</p>
    </div>
    <span class="seal" aria-hidden="true"></span>
  </div>
</body>
</html>
